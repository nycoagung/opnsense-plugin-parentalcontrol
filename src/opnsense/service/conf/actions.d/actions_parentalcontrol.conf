[sync]
command:/usr/local/opnsense/scripts/OPNsense/ParentalControl/sync.php
parameters:
type:script
message:Applying parental control
description:Apply parental control device states

[status]
command:/usr/local/opnsense/scripts/OPNsense/ParentalControl/sync.php status
parameters:
type:script_output
message:Reading parental control status

[install]
command:/usr/local/opnsense/scripts/OPNsense/ParentalControl/install.sh
parameters:
type:script
message:Refreshing parental control plugin
description:Install/refresh Parental Control plugin from upstream

[uninstall]
command:/usr/local/opnsense/scripts/OPNsense/ParentalControl/uninstall.php
parameters:
type:script_output
message:Removing parental control firewall objects
description:Remove Parental Control aliases, rule and cron job
